<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>НМТ-Бінго: Математичні фейли</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Math&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg2:#E9F3FF; --sky:#CDE4FD; --ice:#E6F2FF; --line:#A7CDFD;
  --blue:#0476F3; --deep:#0A1EF5; --brand:#548AF2; --ink:#0E1424; --muted:#4A5675;
  --card:#FFFFFF; --red:#FF5F57; --amber:#FEBC2E; --green:#28C840;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08102B; --bg2:#0C1840; --sky:#16285C; --ice:#132451; --line:#2C4C96;
    --ink:#F2F6FF; --muted:#A9B8DD; --card:#0F1C46; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08102B; --bg2:#0C1840; --sky:#16285C; --ice:#132451; --line:#2C4C96;
  --ink:#F2F6FF; --muted:#A9B8DD; --card:#0F1C46; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:"Google Sans Flex","Google Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:var(--bg);background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg) 35%,var(--bg2) 100%);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
math{font-family:"Noto Sans Math","STIX Two Math","Cambria Math",math}
.app{max-width:560px;margin:0 auto;padding:10px 12px 28px}
.top{display:flex;align-items:center;gap:10px;background:var(--sky);border-radius:999px;padding:8px 14px}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--red)}.dots i:nth-child(2){background:var(--amber)}.dots i:nth-child(3){background:var(--green)}
.logo{height:17px;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
.nick{margin-left:auto;font-size:12px;font-weight:600}
/* hero */
.hero{margin-top:12px;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(135deg,#0A1EF5,#548AF2);color:#fff;min-height:118px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero-t{position:relative;padding:18px 16px 16px;max-width:64%}
.hero-t h1{margin:0;font-size:clamp(26px,7.4vw,36px);line-height:1.05;font-weight:800;letter-spacing:-.4px}
.hero-t p{margin:6px 0 0;font-size:15px;font-weight:500;opacity:.92}
.note{display:flex;gap:12px;align-items:flex-start;margin-top:12px;border:1.5px solid var(--blue);border-radius:14px;padding:12px 14px;background:var(--card)}
.note img{width:38px;height:38px;flex:none}
.note p{margin:0;font-size:15px;line-height:1.45}
.note b{color:var(--blue)}
/* counters */
.bar{display:flex;gap:8px;margin-top:12px}
.pill{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px;background:var(--ice);border:1.5px solid var(--line);border-radius:14px;padding:9px 10px;font-size:14px;color:var(--muted)}
.pill b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.pill.hot{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 18%,var(--card))}
/* grid */
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:7px}
.cell{position:relative;aspect-ratio:1;border:1.5px solid var(--line);background:var(--ice);color:var(--ink);border-radius:16px;
  padding:10px 8px;font:inherit;font-size:14px;line-height:1.28;font-weight:500;text-align:center;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,border-color .2s,transform .12s,box-shadow .25s;overflow-wrap:break-word;hyphens:manual}
.cell:hover{border-color:var(--blue)}
.cell:active{transform:scale(.96)}
.cell:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.cell.star{border:2px solid var(--amber)}
.sfx{white-space:nowrap}
.cell strong{font-weight:800}
.cell .badge{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:var(--amber);color:#2A1C00;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap}
.cell.on{background:linear-gradient(160deg,#548AF2 0%,#2F6BEA 55%,#1A3FE0 100%);color:#fff;border-color:transparent;animation:pop .3s ease-out}
.cell.on math{color:#fff}
.cell .tick{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #1A3FE0;display:none;place-items:center;z-index:2}
.cell .tick svg{width:14px;height:14px}
.cell.on .tick{display:grid;animation:tick .3s ease-out}
.cell.line{box-shadow:0 0 0 3px var(--amber),0 6px 18px rgba(254,188,46,.45)}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes tick{from{transform:scale(0)}to{transform:scale(1)}}
/* result card */
.rcard{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;overflow:hidden}

.rbody{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px}
.mini{display:grid;grid-template-columns:repeat(3,22px);grid-auto-rows:22px;gap:4px}
.mini i{border-radius:6px;background:var(--ice);border:1.5px solid var(--line)}
.mini i.on{background:#548AF2;border-color:#548AF2}
.mini i.ln{box-shadow:0 0 0 2px var(--amber)}
.status{font-size:20px;font-weight:800;line-height:1.15;color:var(--blue)}
.status-sub{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.35}
.rstats{grid-column:1/-1;display:flex;gap:8px}
.rstats div{flex:1;background:var(--ice);border-radius:12px;padding:8px;text-align:center;font-size:12.5px;color:var(--muted)}
.rstats b{display:block;font-size:19px;color:var(--ink)}
.rfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.rfoot .logo{height:14px}
.btn{display:block;width:100%;margin-top:12px;border:1.5px solid var(--line);border-radius:16px;padding:15px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;background:var(--ice);color:var(--blue)}
.btn.primary{border:0;color:#fff;background:linear-gradient(180deg,#2F7BFF,#0A1EF5)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,16,43,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:24px;overflow:hidden;text-align:center;animation:rise .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.sheet .head{background:linear-gradient(135deg,#0A1EF5,#548AF2);color:#fff;font-weight:800;font-size:34px;letter-spacing:1px;padding:18px}
.sheet .body{padding:18px 20px 20px}
.sheet .emo{font-size:52px;line-height:1}
.sheet .st{font-size:22px;font-weight:800;color:var(--blue);margin-top:8px}
.sheet .ss{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:15px;opacity:0;transition:.3s;z-index:35;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* small phones: let text breathe */
@media (max-width:380px){.cell{font-size:13.5px;padding:9px 6px;aspect-ratio:auto;min-height:104px}.grid{gap:6px}}
/* tablet */
@media (min-width:700px){
  .app{max-width:760px;padding:18px 28px 36px}
  .top{padding:10px 18px}.logo{height:19px}.nick{font-size:13px}
  .hero{min-height:150px}.hero-t{padding:26px 24px}.hero-t h1{font-size:42px}
  .grid{gap:12px}.cell{font-size:17px;padding:14px 12px;border-radius:20px}
  .cell .tick{width:28px;height:28px;top:-9px;right:-9px}
  .rcard,.actions{max-width:560px;margin-left:auto;margin-right:auto}
}
/* laptop: grid left, info right */
@media (min-width:1000px){
  .app{max-width:1160px;padding:20px 32px 40px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"side grid" "card grid";column-gap:28px;align-items:start;margin-top:4px}
  .main{display:contents}
  .side{grid-area:side}.grid{grid-area:grid;margin-top:12px}#cardwrap{grid-area:card}
  .side .hero{margin-top:12px}
  .cell{font-size:16.5px}
  .rcard,.actions{max-width:none}
}
@media (min-width:1000px) and (max-height:820px){
  .grid{max-width:calc(100vh - 110px);justify-self:center;width:100%}
  .cell{font-size:15px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function tex(s,inline){
  let i=0, prevOp=true;
  const group=()=>{ while(s[i]===' ')i++;
    if(s[i]==='{'){i++;const sv=prevOp;prevOp=true;const r=seq('}');i++;prevOp=sv;return '<mrow>'+r.join('')+'</mrow>';}
    return atom(); };
  function atom(){
    const c=s[i];
    if(c==='\\'){
      i++; let n=''; while(i<s.length&&/[a-zA-Z]/.test(s[i]))n+=s[i++];
      if(n==='frac'){const a=group(),b=group();return `<mfrac>${a}${b}</mfrac>`;}
      if(n==='sqrt'){ if(s[i]==='['){i++;const idx=seq(']');i++;const a=group();return `<mroot>${a}<mrow>${idx.join('')}</mrow></mroot>`;}
        return `<msqrt>${group()}</msqrt>`; }
      if(n==='left'||n==='right'){return atom();}
      if(FUN.includes(n)) return {fn:`<mi>${n}</mi>`};
      if(n==='pm'&&prevOp) return '<mo form="prefix" lspace="0" rspace="0">±</mo>';
      if(SYM[n]){const [t,v]=SYM[n];return t==='mi'&&v.length===1&&v!=='π'?`<mi mathvariant="normal">${v}</mi>`:`<${t}>${v}</${t}>`;}
      return `<mi>${n}</mi>`;
    }
    if(/[0-9]/.test(c)){let n='';while(i<s.length&&(/[0-9]/.test(s[i])||(s[i]===','&&/[0-9]/.test(s[i+1]||''))))n+=s[i++];return `<mn>${n}</mn>`;}
    if(/[a-zA-Z]/.test(c)){i++;return `<mi>${c}</mi>`;}
    if(c==='{'){return group();}
    i++;
    if(c==='-'&&prevOp) return '<mo form="prefix" lspace="0" rspace="0">−</mo>';
    if(c==='+'&&prevOp) return '<mo form="prefix" lspace="0" rspace="0">+</mo>';
    if(c==='°') return '<mo lspace="0" rspace="0">°</mo>';
    if(c==='|') return '<mo fence="true" lspace="0" rspace="0" stretchy="false">|</mo>';
    const m={'-':'−','*':'·'}[c]||c;
    if(m==='(')return '<mo stretchy="false" lspace="0" rspace="0">(</mo>'; if(m===')')return '<mo stretchy="false" lspace="0" rspace="0">)</mo>';
    return `<mo>${esc(m)}</mo>`;
  }
  function seq(end){
    const out=[]; let fnPending=false; prevOp=true;
    while(i<s.length&&s[i]!==end){
      if(s[i]===' '){i++;continue;}
      if(s[i]==='^'||s[i]==='_'){
        const op=s[i];i++;const arg=group();const base=out.pop()||'<mrow></mrow>';
        while(s[i]===' ')i++;
        if(s[i]==='^'||s[i]==='_'){const op2=s[i];i++;const arg2=group();
          const sub=op==='_'?arg:arg2, sup=op==='^'?arg:arg2; out.push(`<msubsup>${base}${sub}${sup}</msubsup>`);}
        else out.push(op==='^'?`<msup>${base}${arg}</msup>`:`<msub>${base}${arg}</msub>`);
        prevOp=false; continue;
      }
      let a=atom();
      if(typeof a==='object'){ if(fnPending)out.push('<mspace width="0.2em"/>'); out.push(a.fn); fnPending=true; continue; }
      if(fnPending && !a.startsWith('<mo stretchy')) out.push('<mspace width="0.2em"/>');
      fnPending=false; out.push(a);
      prevOp = a.startsWith('<mo') && !a.includes('>)<');
    }
    return out;
  }
  return '<math><mstyle displaystyle="'+(inline?'false':'true')+'">'+seq(null).join('')+'</mstyle></math>';
}
function mixed(str){
  return str.split('$').map((p,k)=>k%2?tex(p,true):esc(p)).join('');

const sfx=s=>s.replace(/\((-[^)<]+)\)/g,(m,g)=>'<wbr><span class="sfx">('+g.replace('-','\u2011')+')</span>');
const grid=$('grid');
grid.innerHTML=CELLS.map((c,i)=>`<button class="cell${i===4?' star':''}" data-i="${i}" aria-pressed="false">${i===4?'<span class="badge">★ особлива</span>':''}<span class="tick">${tick}</span><span>${sfx(mixed(c)).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</span></button>`).join('');
$('mini').innerHTML='<i></i>'.repeat(9);
const statusFor=n=>STATUS.find(s=>n<=s.max);
function doneLines(){return LINES.filter(l=>l.every(i=>marked[i]));}
function render(){
  const n=marked.filter(Boolean).length, dl=doneLines(), inLine=new Set(dl.flat());
  grid.querySelectorAll('.cell').forEach((b,i)=>{b.classList.toggle('on',marked[i]);b.classList.toggle('line',inLine.has(i));b.setAttribute('aria-pressed',marked[i]);});
  $('mini').querySelectorAll('i').forEach((m,i)=>{m.classList.toggle('on',marked[i]);m.classList.toggle('ln',inLine.has(i));});
  $('cnt').textContent=n+'/9'; $('lines').textContent=dl.length; $('bpill').classList.toggle('hot',dl.length>0);
  $('r-cnt').textContent=n+'/9'; $('r-lines').textContent=dl.length;
  const st=statusFor(n); $('status').textContent=st.t+' '+st.emo; $('statusSub').innerHTML=sfx(esc(st.s));
  return {n,lines:dl.length};
}
grid.addEventListener('click',e=>{
  const b=e.target.closest('.cell'); if(!b)return;
  const i=+b.dataset.i; marked[i]=!marked[i];
  b.classList.remove('on'); void b.offsetWidth;
  const r=render();
  if(r.lines>0&&!celebrated){celebrated=true;celebrate(r);}
  else if(r.lines>lastLines&&celebrated){toast(`Ще одна лінія! Бінго: ${r.lines}`);burst(60);}
  lastLines=r.lines; save();
});
function celebrate(r){
  const st=statusFor(r.n);
  $('memo').textContent=st.emo; $('mst').textContent=st.t; $('mss').innerHTML=sfx(esc(st.s));
  $('modal').classList.add('on'); $('mclose').focus(); burst(170);
}
$('mclose').addEventListener('click',()=>{$('modal').classList.remove('on');$('rcard').scrollIntoView({behavior:'smooth',block:'center'});});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('on');});
$('clear').addEventListener('click',()=>{marked=new Array(9).fill(false);celebrated=false;lastLines=0;render();save();toast('Поле очищено');});
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1800);}
$('rdate').textContent=new Date().toLocaleDateString('uk-UA')+' · гра від куратора';
/* confetti */
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=null;
const COLS=['#548AF2','#0A1EF5','#A7CDFD','#FEBC2E','#FF5F57','#28C840','#FFFFFF'];
function burst(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);
  for(let k=0;k<n;k++){const fromLeft=k%2===0;parts.push({x:fromLeft?-10:innerWidth+10,y:innerHeight*.65,vx:(fromLeft?1:-1)*(4+Math.random()*7),vy:-(9+Math.random()*9),
    w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:COLS[k%COLS.length],life:0});}
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life/6)));cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<400);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}
lastLines=render().lines;
</script>
</body>
</html>
